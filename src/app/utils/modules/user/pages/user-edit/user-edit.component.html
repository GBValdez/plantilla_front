<a routerLink="/session/user-home" class="back-link">← Volver a usuarios</a>
@if (userEdit) {
  <h1 class="title">{{ userEdit.userName }}</h1>
  <form [formGroup]="form" (ngSubmit)="save()" class="edit-form">
    <section class="edit-panel">
      <h2>Información general</h2>
      <p class="email">{{ userEdit.email }}</p>
      <mat-form-field appearance="outline">
        <mat-label>Estado de la cuenta</mat-label>
        <mat-select formControlName="status">
          <mat-option [value]="true">Activo</mat-option
          ><mat-option [value]="false">Inactivo</mat-option>
        </mat-select>
      </mat-form-field>
    </section>
    <section class="edit-panel">
      <h2>Roles</h2>
      <app-list-maker-list
        [listOpt]="rolOpt"
        (foundingEvent)="foundRoles($event)"
        formControlName="roles"
        >Buscar Rol</app-list-maker-list
      >
      <button mat-button type="button" (click)="clean()" [disabled]="saving">
        Limpiar
      </button>
    </section>
    <section class="edit-panel actions">
      <a mat-button routerLink="/session/user-home">Cancelar</a>
      <button mat-flat-button type="submit" [disabled]="form.invalid || saving">
        {{ saving ? "Guardando…" : "Guardar cambios" }}
      </button>
    </section>
  </form>
} @else if (loadError) {
  <p role="alert">
    No pudimos cargar la cuenta. Vuelve al listado e inténtalo nuevamente.
  </p>
} @else {
  <p role="status">Cargando cuenta…</p>
}
