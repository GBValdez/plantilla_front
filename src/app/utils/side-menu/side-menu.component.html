<nav
  #navigation
  aria-label="Navegación principal"
  tabindex="0"
  [class.navCollapse]="collapseValue"
  (pointerenter)="pointerEnter($event)"
  (pointerleave)="pointerLeave($event)"
  (focusin)="focusIn($event)"
  (focusout)="focusOut($event)"
  (keydown.escape)="collapseMenu()"
>
  <div class="brand">
    <img src="logo.webp" alt="" class="logo" />
    @if (showElementsValue) {
      <div class="brand-copy">
        <h2>Pedidos</h2>
        <p>{{ gmail }}</p>
      </div>
    }
  </div>
  <button
    class="menu-toggle"
    type="button"
    (click)="toggle()"
    [attr.aria-expanded]="!collapseValue"
    aria-controls="primary-menu"
    [attr.aria-label]="collapseValue ? 'Abrir menú' : 'Contraer menú'"
  >
    <mat-icon aria-hidden="true">{{
      collapseValue ? "menu" : "menu_open"
    }}</mat-icon>
  </button>
  <div id="primary-menu" class="menu">
    <app-sub-level
      [buttons]="buttons"
      [collapseObs]="getObsColapse()"
      [showElementsObs]="getObsShowElements()"
    ></app-sub-level>
  </div>
</nav>
