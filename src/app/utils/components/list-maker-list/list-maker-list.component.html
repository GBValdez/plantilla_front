<app-input-autocomplete
  (writingEvent)="founding($event)"
  [options]="listOpt"
  [noFilter]="!isLocal"
  (selectedEvent)="addItems($event)"
  [formControl]="inputControl"
  (noExistOptionEvent)="noExistOption($event)"
>
  <ng-content></ng-content>
</app-input-autocomplete>
<div class="selected-items" aria-label="Registros seleccionados">
  @for (item of itemsSelected; track item.id) {
    <span class="selected-item"
      >{{ item.name }}
      <button
        type="button"
        [disabled]="disabled"
        (click)="removeItem(item)"
        [attr.aria-label]="'Quitar ' + item.name"
      >
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </span>
  } @empty {
    <p class="empty-selection">No ha seleccionado ningún registro</p>
  }
</div>
